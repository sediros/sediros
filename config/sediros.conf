# =============================================================================
#  SedirOS build configuration (GNU make syntax, included by the Makefile).
#  Every value can be overridden on the command line:  make build RELEASE=1.1
# =============================================================================

# SedirOS release: <major>.<minor>, SedirOS's own numbering. The major
# number selects the Debian base (1 = Debian 13 trixie, 2 = Debian 14 forky;
# see scripts/lib/release.sh). Development builds on sid:
#   make build SUITE=sid
RELEASE ?= 1.1

# Virtual size of the qcow2 base image (sparse, only used blocks are stored).
IMAGE_SIZE ?= 4G

# Admin user inside the image.
GUEST_USER ?= sediros

# Image profile:
#   vm      password locked, passwordless sudo, dev SSH key baked in
#           (sediros launch, make test, CI)
#   install empty + expired password: the first console login must set one,
#           sudo asks for it; SSH stays key-only, no key baked in
# Artifacts of the install profile are tagged: sediros-<release>-install-<arch>.*
PROFILE ?= vm

# Default VM name for `make launch` / `make shell`.
VM ?= dev

# Smoke test budgets.
MAX_BOOT_SECS ?= 30
MAX_RAM_MB ?= 256
