# SedirOS live ISO - GRUB menu (template, filled in by scripts/build_iso.sh)
#   @VERSION@  release, build id and arch (from /etc/sediros/build-info)
#   @CONSOLE@  console= parameters for the target architecture
#   @CMDLINE@  hardening parameters from build/kernel-cmdline.txt

set timeout=3
set default=0

menuentry "SedirOS Live (@VERSION@)" {
    linux  /live/vmlinuz boot=live @CONSOLE@ @CMDLINE@
    initrd /live/initrd.img
}

menuentry "SedirOS Live (@VERSION@) - copy to RAM" {
    linux  /live/vmlinuz boot=live toram @CONSOLE@ @CMDLINE@
    initrd /live/initrd.img
}
