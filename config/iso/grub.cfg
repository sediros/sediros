# Sisura live ISO - GRUB menu (template, filled in by scripts/build_iso.sh)
#   @VERSION@  release-arch date
#   @CONSOLE@  console= parameters for the target architecture
#   @CMDLINE@  hardening parameters from build/kernel-cmdline.txt

set timeout=3
set default=0

menuentry "Sisura Live (@VERSION@)" {
    linux  /live/vmlinuz boot=live @CONSOLE@ @CMDLINE@
    initrd /live/initrd.img
}

menuentry "Sisura Live (@VERSION@) - copy to RAM" {
    linux  /live/vmlinuz boot=live toram @CONSOLE@ @CMDLINE@
    initrd /live/initrd.img
}
