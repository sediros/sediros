# =============================================================================
#  Sisura build configuration (GNU make syntax, included by the Makefile).
#  Every value can be overridden on the command line:  make build RELEASE=13.2
# =============================================================================

# Sisura release: <debian major>.<point>. The Debian suite follows from the
# major number (12 bookworm, 13 trixie, 14 forky). Development builds on sid:
#   make build SUITE=sid
RELEASE ?= 13.1

# Virtual size of the qcow2 base image (sparse, only used blocks are stored).
IMAGE_SIZE ?= 4G

# Admin user inside the image.
GUEST_USER ?= sisura

# Image profile:
#   vm      password locked, passwordless sudo, dev SSH key baked in
#           (sisura launch, make test, CI)
#   install empty + expired password: the first console login must set one,
#           sudo asks for it; SSH stays key-only, no key baked in
# Artifacts of the install profile are tagged: sisura-<release>-install-<arch>.*
PROFILE ?= vm

# Default VM name for `make launch` / `make shell`.
VM ?= dev

# Smoke test budgets.
MAX_BOOT_SECS ?= 30
MAX_RAM_MB ?= 256
