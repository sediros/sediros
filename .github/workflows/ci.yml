# SedirOS CI
#   lint  : bash -n, shellcheck, rustfmt, clippy
#   build : rootfs + qcow2 + ISO for amd64 (KVM smoke test) and arm64 (build only)
name: ci

on:
  # Documentation-only changes build nothing that the tests could catch.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sediros-cli
      - run: rustup component add rustfmt clippy
      - run: make lint

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            grub: grub-pc-bin   # BIOS boot of the ISO; UEFI uses the signed GRUB from the rootfs
            smoke: true
          - arch: arm64
            runner: ubuntu-24.04-arm
            grub: ""
            smoke: false   # no KVM on hosted arm64 runners; TCG is too slow for the budget
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        # A stuck mirror once held this step for over 10 minutes.
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            debootstrap debian-archive-keyring zstd e2fsprogs qemu-utils \
            squashfs-tools xorriso mtools dosfstools grub-common ${{ matrix.grub }} \
            qemu-system-x86 qemu-system-arm ovmf openssh-client \
            dpkg-dev apt-utils gnupg gpgv xz-utils

      - name: Enable KVM
        if: matrix.smoke
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sediros-cli

      - name: Build rootfs + image + cli
        run: make build

      - name: Smoke test
        if: matrix.smoke
        run: |
          # The image build (chroot with /dev bound, package scripts) can
          # leave /dev/kvm with other permissions than set above.
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm
          make test

      - name: apt repository test (signature, pin, unattended update)
        if: matrix.smoke
        run: |
          sudo chmod 0666 /dev/kvm
          make apt-test

      - name: sediros-firstboot test (NoCloud seed, metadata service)
        if: matrix.smoke
        run: |
          sudo chmod 0666 /dev/kvm
          make firstboot-test

      - name: Build ISO
        run: make iso

      - name: Secure Boot tests (live ISO, install, installed system)
        if: matrix.smoke
        run: |
          sudo chmod 0666 /dev/kvm
          make iso-test
          make install-test

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sediros-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/*.qcow2
            build/*.qcow2.sha256
            build/*.iso
            build/*.iso.sha256
            build/*.manifest
