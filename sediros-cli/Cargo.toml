[package]
name = "sediros-cli"
version = "0.6.3"
edition = "2021"
rust-version = "1.74"
description = "Fast, isolated QEMU/KVM/HVF test runner for SedirOS images"
license = "Apache-2.0"
authors = ["The SedirOS Authors <ahmetatakan.tech@gmail.com>"]
publish = false

[[bin]]
name = "sediros"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
