# SedirOS maintenance window (sediros-maintenance, sediros-maintenance.timer).
# Security updates install themselves, but a new kernel (or libc, systemd,
# OpenSSL in running services) only takes effect after a reboot. This file
# chooses what happens when an update needs one. Check with:
#   sediros-maintenance status

# off   never reboot by itself (default); the login notice and the daily
#       audit say that a reboot is required
# ask   reboot in the window after an admin approved it:
#         sudo sediros-maintenance approve
# auto  reboot in the window, with a notification before and after
MODE=off

# Day(s) and start time, server's local time; the window is one hour.
# Examples: Sun 04:00 / Mon,Thu 03:30 / daily 04:00
WINDOW=Sun 04:00

# In every mode: no reboot while someone is logged in (it moves to the
# next window); `sudo sediros-maintenance skip` skips one window.
# An encrypted root disk needs SSH unlock at boot (installer question):
# during the window unlock it from your machine with `sediros unlock`.
# Without it, ask and auto refuse, as the server would wait for its
# passphrase. Notifications go where the daily audit's go (MAILTO,
# WEBHOOK in /etc/sediros/audit.conf).
