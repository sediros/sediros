# SedirOS daily audit (sediros-audit.timer, sudo sediros-audit --record).
# Every day the audit keeps its result in /var/lib/sediros/audit (shown at
# login) and, when the hardening got worse than the day before, reports it
# here. Nothing is sent anywhere until one of these is set.

# E-mail, through the local mail transfer agent (sendmail -t).
#MAILTO=admin@example.org

# Webhook: the report is POSTed as plain text (ntfy.sh and similar), or as
# {"text": ...} with WEBHOOK_FORMAT=slack (Slack, Mattermost, Discord's
# /slack endpoint). Needs curl.
#WEBHOOK=https://ntfy.sh/your-private-topic
#WEBHOOK_FORMAT=text

# Prometheus node_exporter textfile collector directory; the metrics file
# sediros_audit.prom is written when it exists.
#PROMETHEUS_DIR=/var/lib/prometheus/node-exporter
