# Sisura (sisura-boot-hardening): kernel hardening parameters for every
# Linux entry generated by update-grub. scripts/build_rootfs.sh reads the
# same value for VM images, so this is the single place to change them.
SISURA_KERNEL_CMDLINE="apparmor=1 security=apparmor slab_nomerge init_on_alloc=1 page_alloc.shuffle=1 randomize_kstack_offset=on vsyscall=none debugfs=off"
GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+$GRUB_CMDLINE_LINUX }$SISURA_KERNEL_CMDLINE"
GRUB_DISTRIBUTOR="Sisura"
