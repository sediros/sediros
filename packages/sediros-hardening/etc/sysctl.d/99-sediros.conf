# =============================================================================
#  SedirOS - hardened kernel parameters
#  /etc/sysctl.d/99-sediros.conf
#
#  Applied by systemd-sysctl at boot and by UFW (IPT_SYSCTL points here).
#  Keys prefixed with '-' are optional: if the running kernel does not know
#  the key (older/newer kernel), the failure is ignored instead of logged as
#  an error. Supported by both systemd-sysctl and procps sysctl.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Kernel information leaks
# -----------------------------------------------------------------------------
# Hide kernel pointers from everyone (incl. root via %pK).
kernel.kptr_restrict = 2
# dmesg only for CAP_SYSLOG.
kernel.dmesg_restrict = 1
# Do not spam the console with kernel messages (helps against info leaks on tty).
kernel.printk = 3 3 3 3

# -----------------------------------------------------------------------------
# 2. Attack surface reduction
# -----------------------------------------------------------------------------
# eBPF: unprivileged usage disabled (1 = cannot be re-enabled until reboot).
kernel.unprivileged_bpf_disabled = 1
# Harden BPF JIT against JIT-spraying for all users.
net.core.bpf_jit_harden = 2
# Disallow loading a new kernel via kexec (one-way switch).
kernel.kexec_load_disabled = 1
# Disable magic SysRq entirely.
kernel.sysrq = 0
# Unprivileged user namespaces (Debian-specific knob).
# NOTE: breaks rootless podman/docker and the Chromium/Electron sandbox.
-kernel.unprivileged_userns_clone = 0
# perf: 3 = no perf_event_open() for unprivileged users (Debian patch).
kernel.perf_event_paranoid = 3
# ptrace: 2 = only processes with CAP_SYS_PTRACE (gdb/strace as user won't attach).
kernel.yama.ptrace_scope = 2
# Do not auto-load TTY line disciplines (CVE-2017-2636 class).
dev.tty.ldisc_autoload = 0
# Disable TIOCSTI ioctl (terminal input injection). Kernel >= 6.2.
-dev.tty.legacy_tiocsti = 0
# userfaultfd only for CAP_SYS_PTRACE (heap exploitation primitive).
vm.unprivileged_userfaultfd = 0
# io_uring: 2 = disabled for everyone. Kernel >= 6.6.
# Set to 1 + io_uring_group if a workload needs it.
-kernel.io_uring_disabled = 2

# -----------------------------------------------------------------------------
# 3. Memory / ASLR
# -----------------------------------------------------------------------------
kernel.randomize_va_space = 2
# Maximum mmap ASLR entropy on x86_64 (ignored on archs with other limits).
-vm.mmap_rnd_bits = 32
-vm.mmap_rnd_compat_bits = 16
vm.mmap_min_addr = 65536

# -----------------------------------------------------------------------------
# 4. Core dumps
# -----------------------------------------------------------------------------
# No core dumps for setuid/privileged processes.
fs.suid_dumpable = 0
# Discard every core dump (no systemd-coredump on SedirOS).
kernel.core_pattern = |/bin/false
kernel.core_uses_pid = 1

# -----------------------------------------------------------------------------
# 5. Filesystem protections
# -----------------------------------------------------------------------------
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# -----------------------------------------------------------------------------
# 6. IPv4 network stack
# -----------------------------------------------------------------------------
# Not a router.
net.ipv4.ip_forward = 0
net.ipv4.conf.all.forwarding = 0
net.ipv4.conf.default.forwarding = 0

# Strict reverse-path filtering (anti-spoofing). Use 2 on multi-homed hosts.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# ICMP redirects: neither accept nor send.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Source routing off.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Log spoofed / source-routed / redirect packets.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore broadcast pings (smurf) and bogus ICMP errors.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ARP hardening.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2

# TCP: SYN flood protection, TIME-WAIT assassination protection.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
# Keep request-socket migration off (kernel default). It opens an extra path
# into the TCP handshake code (e.g. CVE-2026-98432) and is not used here.
net.ipv4.tcp_migrate_req = 0
# Multipath TCP off: another way into the same connection-setup code (the
# second workaround advised for CVE-2026-98432), and servers do not need it;
# MPTCP clients fall back to plain TCP.
-net.mptcp.enabled = 0

# -----------------------------------------------------------------------------
# 7. IPv6 network stack
# -----------------------------------------------------------------------------
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.default.forwarding = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# Kernel-level RA processing off; systemd-networkd handles RA in userspace
# (IPv6AcceptRA=) so SLAAC still works on networkd-managed links.
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
# Privacy extensions (temporary addresses preferred).
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# -----------------------------------------------------------------------------
# 8. Performance (low-RAM VM / server profile)
# -----------------------------------------------------------------------------
# Prefer reclaiming page cache over swapping anonymous memory.
vm.swappiness = 10
vm.vfs_cache_pressure = 50
# Fair queueing + BBR congestion control (tcp_bbr module, optional).
net.core.default_qdisc = fq
-net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.core.somaxconn = 4096
