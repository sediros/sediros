# Sisura: show "Sisura Linux <release>" before the login prompt. Debian's
# /etc/issue (base-files) is left alone; agetty reads this file instead and
# takes the name from os-release (\S{PRETTY_NAME}).
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-- \\u' --noreset --noclear --issue-file /usr/share/sisura/issue - ${TERM}
